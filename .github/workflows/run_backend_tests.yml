name: Run Chatwoot CE Backend Tests

# Throttling Strategies:
# 1. Skip draft PRs - only run when PR is ready for review
# 2. Cancel outdated runs - when new commits pushed, cancel old runs
# 3. Ignore non-code changes - skip for docs, markdown files
# 4. Manual trigger available - use workflow_dispatch when needed

on:
  push:
    branches:
      - development
      - main
    # Only trigger when backend files change
    paths:
      - 'app/**/*.rb'
      - 'enterprise/**/*.rb'
      - 'lib/**'
      - 'spec/**'
      - 'config/**'
      - 'db/**'
      - 'Gemfile*'
      - '.rubocop.yml'
      - '.github/workflows/run_backend_tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only trigger when backend files change
    paths:
      - 'app/**/*.rb'
      - 'enterprise/**/*.rb'
      - 'lib/**'
      - 'spec/**'
      - 'config/**'
      - 'db/**'
      - 'Gemfile*'
      - '.rubocop.yml'
      - '.github/workflows/run_backend_tests.yml'
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-22.04
    # Skip if PR is a draft
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    concurrency:
      # Cancel outdated runs when new commits are pushed
      # Uses PR number for PRs, branch name for pushes
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        # tmpfs makes DB faster by using RAM
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm i

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Create database
        run: bundle exec rake db:create

      - name: Load upstream schema
        run: bundle exec rake db:schema:load

      - name: Load custom schema
        run: bundle exec rake db:schema:load:custom

      - name: Run backend tests
        run: |
          bundle exec rspec --profile=10 --format documentation
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Upload rails log folder
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rails-log-folder
          path: log
