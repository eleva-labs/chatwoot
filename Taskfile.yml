version: '3'

env:
  COMPOSE_FILE: docker-compose.yaml

tasks:
  # ---------------------------------------------------------------------
  # unit testing
  # ---------------------------------------------------------------------
  test-check-db:
    desc: 'Check for running databases on port 5432'
    cmds:
      - |
        if lsof -Pi :5432 -sTCP:LISTEN -t >/dev/null 2>&1 ; then
          echo "⚠️  Database is running on port 5432"
          lsof -Pi :5432 -sTCP:LISTEN
          exit 1
        else
          echo "✅ No database running on port 5432"
        fi
    silent: false

  test-stop-db:
    desc: 'Stop any running databases on port 5432'
    cmds:
      - |
        if lsof -Pi :5432 -sTCP:LISTEN -t >/dev/null 2>&1 ; then
          echo "🛑 Stopping database on port 5432..."
          docker ps -q --filter "publish=5432" | xargs -r docker stop
          brew services list | grep postgresql | grep started && brew services stop postgresql || true
          sleep 2
          echo "✅ Database stopped"
        else
          echo "✅ No database running"
        fi
    silent: false

  test-setup-db:
    desc: 'Setup test database (starts Docker postgres and prepares schema)'
    cmds:
      - task: test-stop-db
      - echo "🚀 Starting test database..."
      - docker compose up -d postgres redis
      - sleep 5
      - echo "📦 Preparing test database schema..."
      - POSTGRES_HOST=localhost POSTGRES_USERNAME=postgres POSTGRES_PASSWORD=password REDIS_URL=redis://localhost:6379/0 RAILS_ENV=test bundle exec rails db:chatwoot_prepare
      - echo "✅ Test database ready"

  test-backend-all:
    desc: 'Run all backend RSpec tests (set SETUP_DB=true to setup DB, CLEANUP=true to cleanup)'
    cmds:
      - '{{if eq .SETUP_DB "true"}}task: test-setup-db{{end}}'
      - echo "Running all RSpec tests"
      - POSTGRES_HOST=localhost POSTGRES_USERNAME=postgres POSTGRES_PASSWORD=password REDIS_URL=redis://localhost:6379/0 RAILS_ENV=test bundle exec rspec --format documentation
      - '{{if eq .CLEANUP "true"}}task: test-cleanup{{end}}'

  test-backend-module:
    desc: 'Run RSpec tests for a specific module (usage: task test-backend-module -- spec/models, set SETUP_DB=true to setup DB)'
    cmds:
      - '{{if eq .SETUP_DB "true"}}task: test-setup-db{{end}}'
      - echo "Running RSpec tests for {{.CLI_ARGS}}"
      - POSTGRES_HOST=localhost POSTGRES_USERNAME=postgres POSTGRES_PASSWORD=password REDIS_URL=redis://localhost:6379/0 RAILS_ENV=test bundle exec rspec {{.CLI_ARGS}} --format documentation
      - '{{if eq .CLEANUP "true"}}task: test-cleanup{{end}}'

  test-backend-file:
    desc: 'Run RSpec tests for a specific file (usage: task test-backend-file -- spec/models/user_spec.rb, set SETUP_DB=true to setup DB)'
    cmds:
      - '{{if eq .SETUP_DB "true"}}task: test-setup-db{{end}}'
      - echo "Running RSpec test file {{.CLI_ARGS}}"
      - POSTGRES_HOST=localhost POSTGRES_USERNAME=postgres POSTGRES_PASSWORD=password REDIS_URL=redis://localhost:6379/0 RAILS_ENV=test bundle exec rspec {{.CLI_ARGS}} --format documentation
      - '{{if eq .CLEANUP "true"}}task: test-cleanup{{end}}'

  test-backend-local:
    desc: 'Run RSpec tests locally (requires local postgres/redis)'
    cmds:
      - echo "Running RSpec tests locally"
      - POSTGRES_HOST=localhost POSTGRES_USERNAME=postgres POSTGRES_PASSWORD=password REDIS_URL=redis://localhost:6379/0 RAILS_ENV=test bundle exec rspec {{.CLI_ARGS}} --format documentation

  test-frontend-all:
    desc: 'Run all frontend Vitest tests'
    cmds:
      - echo "Running all Vitest tests"
      - pnpm test

  test-frontend-watch:
    desc: 'Run frontend tests in watch mode'
    cmds:
      - echo "Running Vitest in watch mode"
      - pnpm test:watch

  test-frontend-coverage:
    desc: 'Run frontend tests with coverage'
    cmds:
      - echo "Running Vitest with coverage"
      - pnpm test:coverage

  test-cleanup:
    desc: 'Cleanup test database containers'
    cmds:
      - echo "🧹 Cleaning up test containers..."
      - docker compose stop postgres redis
      - echo "✅ Cleanup complete"

  test-full-cleanup:
    desc: 'Full cleanup including volumes'
    cmds:
      - echo "🧹 Full cleanup (including volumes)..."
      - docker compose down -v
      - echo "✅ Full cleanup complete"

  # ---------------------------------------------------------------------
  # docker
  # ---------------------------------------------------------------------
  docker-build-base:
    desc: 'Build base Docker image'
    cmds:
      - docker compose build base

  docker-build:
    desc: 'Build all Docker images'
    cmds:
      - docker compose build

  docker-setup-dev:
    desc: 'Setup Docker development images'
    cmds:
      - docker compose run --rm rails bundle exec rails db:chatwoot_prepare

  docker-setup-test:
    desc: 'Setup Docker unit-test images'
    cmds:
      - docker compose run --rm rails bundle exec rails db:chatwoot_prepare RAILS_ENV=test

  docker-test:
    desc: 'Run the full RSpec suite inside the Rails container'
    cmds:
      - docker compose run --rm -e RAILS_ENV=test rails bundle exec rspec --profile=10 --format documentation
    silent: true

  docker-up:
    desc: 'Start the Docker containers'
    cmds:
      - docker compose up -d

  docker-stop:
    desc: 'Stop the Docker containers (without removing them)'
    cmds:
      - docker compose stop

  docker-down:
    desc: 'Stop the Docker containers'
    cmds:
      - docker compose down

  docker-clean-volumes:
    desc: 'Delete all Docker volumes'
    cmds:
      - echo "Stopping and removing containers..."
      - docker compose down -v --remove-orphans
      - docker volume prune -f
      - echo "Volume cleanup completed!"

  docker-reload-env:
    desc: 'Reload environment variables without rebuilding'
    cmds:
      - docker-compose stop rails sidekiq vite
      - docker-compose rm -f rails sidekiq vite
      - docker-compose up -d rails sidekiq vite

  docker-chatwoot-build:
    desc: 'Build the Chatwoot container'
    cmds:
      - echo "Stopping and removing containers..."
      - task docker-down
      - echo "Building..."
      - task docker-build
      - echo "Setting up development environment..."
      - task docker-setup-dev
      - echo "Starting containers..."
      - task docker-up
      - echo "Build completed!"
